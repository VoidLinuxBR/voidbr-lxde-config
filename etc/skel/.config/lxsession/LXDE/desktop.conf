[Session]
window_manager=openbox-lxde
disable_autostart=no
polkit/command=lxpolkit
clipboard/command=lxclipboard
xsettings_manager/command=build-in
proxy_manager/command=build-in
keyring/command=ssh-agent
quit_manager/command=lxsession-logout
lock_manager/command=lxlock
terminal_manager/command=lxterminal
quit_manager/image=/usr/share/lxde/images/logout-banner.png
quit_manager/layout=top
windows_manager/command=openbox-lxde

[GTK]
sNet/ThemeName=Tokyonight-Dark-Theme
sNet/IconThemeName=Tokyonight-Dark-Icons
sGtk/FontName=Sans 10
iGtk/ToolbarStyle=3
iGtk/ButtonImages=1
iGtk/MenuImages=1
iGtk/CursorThemeSize=18
iXft/Antialias=1
iXft/Hinting=1
sXft/HintStyle=hintslight
sXft/RGBA=rgb
iNet/EnableEventSounds=1
iNet/EnableInputFeedbackSounds=1
sGtk/ColorScheme=tooltip_bg_color:#414868\nselected_fg_color:#35358484e4e4\nbase_color:#1A1B26\nbg_color:#1A1B26\ntitlebar_fg_color:#E9E9ED\nlink_color:#7DCFFF\ntitlebar_bg_color:#292E42\nmenu_color:#323449\ntooltip_fg_color:#E9E9ED\nvisited_link_color:#BB9AF7\nselected_bg_color:#35358484e4e4\nfg_color:#E9E9ED\ntext_color:#E9E9ED\n
iGtk/ToolbarIconSize=3
sGtk/CursorThemeName=Nordic-cursors

[Mouse]
AccFactor=20
AccThreshold=10
LeftHanded=0

[Keyboard]
Delay=500
Interval=30
Beep=1

[State]
guess_default=true

[Dbus]
lxde=true

[Environment]
menu_prefix=lxde-
